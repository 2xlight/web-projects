<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IHATEYOU</title>
<style>
:root{
  --paper: #121212;
  --card: #1e1e1e;
  --text: #e0e0e0;
  --muted: #888;
  --accent: #ff5100;
  --border: #333;
  --bg-hover: #2a2a2a;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box}
body{margin:0;padding:20px;min-height:100vh;display:flex;flex-direction:column;align-items:center;background:var(--paper);color:var(--text);font-family:var(--font)}

/* Đã bỏ max-width cố định, để width 100% tràn màn hình */
header{width:100%;max-width:1400px;padding:16px 24px;background:var(--card);border-radius:8px;border:1px solid var(--border);margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:1.5rem;color:var(--accent)}

/* Container chính mở rộng tối đa 1400px hoặc 100% */
.container { width: 100%; max-width: 1400px; display: grid; grid-template-columns: 1fr 350px; gap: 20px; }
@media(max-width: 900px){ .container { grid-template-columns: 1fr; } }

/* Sidebar bên phải */
.sidebar { display: flex; flex-direction: column; gap: 20px; }
.widget { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
.widget h3 { margin: 0 0 12px 0; font-size: 1.1rem; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 8px; }

.board-list { display: flex; flex-direction: column; gap: 8px; }
.board-btn { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 10px 14px; text-align: left; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 1rem; }
.board-btn:hover, .board-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* Leaderboard & Khung đại diện */
.leaderboard-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #2a2a2a; font-size: 0.95rem; }
.user-rank-info { display: flex; align-items: center; gap: 10px; }
.avatar-frame-top1 { position: relative; width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(45deg, #ffd700, #ff4500); padding: 2px; display: flex; align-items: center; justify-content: center; }
.avatar-inner { width: 100%; height: 100%; border-radius: 50%; background: #444; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: bold; color: #fff; }

/* Main content phóng to */
.main-content { width: 100%; }
.post-box { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
.post-box h3 { margin-top: 0; font-size: 1.2rem; }
.post-box textarea { width: 100%; background: #121212; border: 1px solid var(--border); color: var(--text); padding: 14px; border-radius: 6px; resize: vertical; min-height: 120px; font-size: 1rem; }
.post-box input { width: 100%; background: #121212; border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 6px; margin-bottom: 12px; font-size: 1rem; }
.post-box select { background: #121212; border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 6px; margin-bottom: 12px; width: 100%; font-size: 1rem; }
.btn { background: var(--accent); color: #fff; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 1rem; }
.btn:hover { opacity: 0.9; }

/* Post Card tràn rộng */
.post-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px 20px; margin-bottom: 16px; display: flex; gap: 16px; }
.vote-section { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-width: 40px; gap: 6px; }
.vote-btn { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 1.2rem; font-weight: bold; }
.vote-btn:hover { color: var(--accent); }
.score-display { font-weight: bold; font-size: 1.1rem; color: var(--text); }

.post-body-content { flex: 1; }
.post-meta { font-size: 0.9rem; color: var(--muted); margin-bottom: 8px; }
.post-text { font-size: 1.05rem; line-height: 1.5; margin: 0 0 14px 0; word-break: break-word; }
.post-footer-actions { display: flex; gap: 20px; font-size: 0.95rem; color: var(--muted); font-weight: 600; cursor: pointer; }
.post-footer-actions span:hover { color: var(--accent); }

.comments-section { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; }
.comment-item { font-size: 0.95rem; background: #121212; padding: 8px 12px; border-radius: 6px; margin-bottom: 8px; }
.comment-form { display: flex; gap: 8px; margin-top: 10px; }
.comment-form input { flex: 1; background: #121212; border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 4px; font-size: 0.95rem; }
</style>
</head>
<body>
<body>
<header>
  <h1>IHATEYOU</h1>
  <form id="search-form" style="display:flex;gap:6px"><input id="q" placeholder="Tìm bài / người..." autocomplete="off"><button class="btn">Tìm</button></form>
  <div id="auth" style="display:flex;gap:6px;align-items:center"></div>
</header>

<div class="container">
  <div>
    <div class="post-box">
      <h3>What's new?</h3>
      <form id="post-form">
        <select id="board-select"></select>
        <textarea id="content" placeholder="Comeout đi..."></textarea>
        <input type="file" id="img" accept="image/png,image/jpeg,image/gif,image/webp" style="margin-bottom:10px">
        <div class="hint" id="guest-hint"></div>
        <button class="btn">Đăng lên Board</button>
      </form>
    </div>
    <div id="posts"></div>
    <div id="pager"></div>
  </div>

  <div class="sidebar">
    <div class="widget prof" id="profile" style="display:none"></div>
    <div class="widget"><h3>Danh mục (Boards)</h3><div class="board-list" id="nav"></div></div>
    <div class="widget">
      <h3>🏆 Bảng Xếp Hạng</h3>
      <div class="tabs">
        <button class="tab active" id="t-cf" onclick="setLB('cf')">Chí Fèo</button>
        <button class="tab" id="t-cf4" onclick="setLB('cf4')">Chí Fèo 4.0</button>
      </div>
      <div id="lb"></div>
    </div>
  </div>
</div>
<footer><a href="/api/admin">/api/admin</a></footer>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LABEL = {noob:"NOOB", pro:"PRO", hacker:"HACKER", admin:"ADMIN CODE"};
let PC = {}, isAdmin = false, page = 1, me = null, board = "all", lbType = "cf", query = "", openC = new Set(), replyTo = {};

const avatar = (n, f) => `<span class="av ${f ? "fr-" + f : ""}" style="--c:${{noob:"#777",pro:"#3b82f6",hacker:"#22c55e",admin:"#ffd700"}[f] || "#444"}">${esc((n[0] || "?").toUpperCase())}</span><b class="lnk" data-u="${esc(n)}">${esc(n)}</b>${f ? `<span class="tag t-${f}">${LABEL[f]}</span>` : ""}`;

async function api(url, body) {
  const o = body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)};
  const r = await fetch(url, o);
  let d = {}; try { d = await r.json(); } catch {}
  if (d.rickroll) { alert(d.error); location.href = d.rickroll; return null; }   // upload sai định dạng → rickroll
  if (d.troll) { alert(`${d.error}\n${d.troll}\n(Web chấm: ${d.web} đ — đã ghi danh vào BXH Chí Fèo 4.0)`); loadLB(); return null; }
  if (!r.ok) { if (d.error) alert(d.error); return null; }
  return d;
}

async function loadMe() {
  const d = await api("/api/me"); me = d && d.user; isAdmin = !!(d && d.admin);
  $("auth").innerHTML = me
    ? `${avatar(me, d.frame)} ${isAdmin ? '<a href="/admin.html" style="color:var(--accent)">⚙️ Admin</a>' : ""} <button class="btn" style="background:#444" onclick="chpw()">Đổi MK</button> <button class="btn" onclick="logout()">Thoát</button>`
    : `<input id="lu" placeholder="Username" style="width:120px" autocomplete="off"><input id="lp" type="password" placeholder="Mật khẩu" style="width:120px">
       <button class="btn" onclick="auth('login')">Đăng nhập</button><button class="btn" style="background:#444" onclick="auth('register')">Đăng ký</button>`;
  $("guest-hint").textContent = me ? "" : "Khách chỉ được đăng 1 bài / IP, không comment/vote. Đăng nhập để đăng thoải mái.";
}
async function auth(kind) {
  if (await api("/api/" + kind, {username: $("lu").value, password: $("lp").value})) refresh();
}
async function logout() { await api("/api/logout", {}); refresh(); }

async function loadBoards() {
  const b = await api("/api/boards"); if (!b) return;
  $("nav").innerHTML = `<button class="board-btn ${board === "all" ? "active" : ""}" onclick="sw('all')">🔥 Tất cả</button>` +
    Object.entries(b).map(([k, v]) => `<button class="board-btn ${board === k ? "active" : ""}" onclick="sw('${esc(k)}')">/${esc(k)}/ - ${esc(v.name)}</button>`).join("");
  if (!$("board-select").options.length)
    $("board-select").innerHTML = Object.entries(b).map(([k, v]) => `<option value="${esc(k)}">/${esc(k)}/ - ${esc(v.name)}</option>`).join("");
}
function sw(k) { board = k; query = ""; page = 1; $("q").value = ""; loadBoards(); loadPosts(); }

async function loadPosts() {
  const u = query ? "/api/search?q=" + encodeURIComponent(query) : "/api/posts?board=" + encodeURIComponent(board);
  const d = await api(u + "&page=" + page);
  if (!d) return;
  page = d.page; renderPosts(d.items); renderPager(d.pages);
}
function renderPager(n) {   // nút chuyển trang
  $("pager").innerHTML = n < 2 ? "" : `<button class="tab" ${page < 2 ? "disabled" : ""} onclick="go(${page - 1})">◀</button><span style="align-self:center">Trang ${page}/${n}</span><button class="tab" ${page >= n ? "disabled" : ""} onclick="go(${page + 1})">▶</button>`;
}
function go(n) { page = n; loadPosts(); scrollTo(0, 0); }

function cmts(p) {
  const by = {}; p.comments.forEach(c => (by[c.parent || 0] ??= []).push(c));
  const draw = (pid, d) => (by[pid] || []).map(c => `
    <div class="comment-item" style="margin-left:${d * 18}px">
      <div>${avatar(c.author, c.frame)}</div>
      <div style="white-space:pre-wrap;word-break:break-word">${esc(c.content)}</div>
      <div class="cm-act">
        <span class="${c.my == 1 ? "on" : ""}" onclick="vote('comments',${c.id},1)">▲</span> ${c.score}
        <span class="${c.my == -1 ? "on" : ""}" onclick="vote('comments',${c.id},-1)">▼</span> ·
        <span onclick="setReply(${p.id},${c.id})">Trả lời</span> ·
        <span onclick="rep('comments',${c.id})">🚩 ${c.reports}</span>
      </div>
    </div>${draw(c.id, Math.min(d + 1, 4))}`).join("");
  return draw(0, 0);
}

function renderPosts(posts) {
  PC = Object.fromEntries(posts.map(p => [p.id, p.content]));   // cache nội dung cho nút Sửa
  if (!posts.length) { $("posts").innerHTML = `<p style="text-align:center;color:var(--muted)">Chưa có bài viết nào.</p>`; return; }
  $("posts").innerHTML = posts.map(p => `
    <div class="post-card">
      <div class="vote"><span class="${p.my == 1 ? "on" : ""}" onclick="vote('posts',${p.id},1)">▲</span>${p.score}<span class="${p.my == -1 ? "on" : ""}" onclick="vote('posts',${p.id},-1)">▼</span></div>
      <div class="body">
        <div class="meta">/${esc(p.board)}/ • ${avatar(p.author, p.frame)}</div>
        <p class="text">${esc(p.content)}</p>
        ${p.image ? `<img class="post-img" src="${esc(p.image)}" alt="">` : ""}
        ${p.board === "CF" ? `<div class="webscore">👥 Người dùng chấm: <b>${p.score}</b> · 🤖 Web chấm: <b>${p.web}</b> — <i>${esc(p.webnote)}</i></div>` : ""}
        <div class="foot"><span onclick="toggle(${p.id})">💬 ${p.comments.length} Bình luận</span><span style="color:#f44" onclick="rep('posts',${p.id})">🚩 Báo cáo (${p.reports})</span>${me && (me === p.author || isAdmin) ? `<span onclick="editPost(${p.id})">✏️ Sửa</span><span onclick="delPost(${p.id})">🗑 Xóa</span>` : ""}</div>
        <div class="comments" id="cb-${p.id}" style="display:${openC.has(p.id) ? "block" : "none"}">
          ${cmts(p)}
          ${me ? `<div class="cform"><input id="cc-${p.id}" placeholder="${replyTo[p.id] ? "Trả lời bình luận #" + replyTo[p.id] : "Viết bình luận..."}" maxlength="500" autocomplete="off">
                  <button class="btn" onclick="sendC(${p.id})">Gửi</button></div>`
               : `<p class="hint">Đăng nhập để bình luận / vote.</p>`}
        </div>
      </div>
    </div>`).join("");
}

function toggle(id) { const b = $("cb-" + id); const o = b.style.display === "none"; b.style.display = o ? "block" : "none"; o ? openC.add(id) : openC.delete(id); }
function setReply(pid, cid) { replyTo[pid] = cid; openC.add(pid); const i = $("cc-" + pid); if (i) { i.placeholder = "Trả lời bình luận #" + cid; i.focus(); } }
async function vote(kind, id, v) { await api(`/api/${kind}/${id}/vote`, {value: v}); loadPosts(); loadLB(); }
async function rep(kind, id) {
  if (!confirm("Xem kĩ lại trước khi báo cáo nha!")) return;
  if (await api(`/api/${kind}/${id}/report`, {})) { alert("Đã ghi nhận báo cáo nhen!"); loadPosts(); }
}
async function sendC(pid) {
  const content = $("cc-" + pid).value; if (!content.trim()) return;
  openC.add(pid);
  await api(`/api/posts/${pid}/comments`, {content, parent: replyTo[pid] || null});
  delete replyTo[pid]; loadPosts();
}

function setLB(t) { lbType = t; $("t-cf").classList.toggle("active", t === "cf"); $("t-cf4").classList.toggle("active", t === "cf4"); loadLB(); }
async function loadLB() {
  const d = await api("/api/leaderboard?type=" + lbType); if (!d) return;
  if (!d.length) { $("lb").innerHTML = `<p class="hint">Chưa có ai.</p>`; return; }
  $("lb").innerHTML = d.map(r => lbType === "cf"
    ? `<div class="lb-item"><div class="lb-row"><span>#${r.rank} ${avatar(r.author, r.frame)}</span><b style="color:var(--accent)">${r.total} đ</b></div>
       <small>👥 ${r.user} + 🤖 ${r.web} · ${r.posts} bài</small></div>`
    : `<div class="lb-item"><div class="lb-row"><span>#${r.rank} ${avatar(r.author, r.frame)}</span><b style="color:var(--accent)">${r.web} đ</b></div>
       <small>${r.attempts} lần phá hoại · 🤖 ${esc(r.note)}</small><code>${esc(r.last)}</code></div>`).join("");
}

// ---------- Hồ sơ người dùng: bấm vào tên bất kỳ ----------
document.addEventListener("click", e => { const u = e.target.dataset && e.target.dataset.u; if (u) profile(u); });
async function profile(name) {
  const d = await api("/api/profile?u=" + encodeURIComponent(name)); if (!d) return;
  const w = $("profile"); w.style.display = "block";
  w.innerHTML = `<h3>👤 Hồ sơ</h3>${avatar(d.user, d.frame)}
    <small>Tổng điểm: <b>${d.user_score + d.web_score}</b> (👥 ${d.user_score} + 🤖 ${d.web_score}) · Điểm bình luận: ${d.comment_score} · Bị bắt payload: ${d.hacks} lần</small>
    <small><b>Bài gần đây</b></small>${d.posts.map(p => `<small>/${esc(p.board)}/ ${esc(p.content)} — ${p.score}${p.web != null ? " | 🤖 " + p.web : ""}</small>`).join("") || "<small>Chưa có</small>"}
    <small><b>Bình luận gần đây</b></small>${d.comments.map(c => `<small>#${c.post}: ${esc(c.content)} (${c.score})</small>`).join("") || "<small>Chưa có</small>"}`;
}
// ---------- Sửa / xóa bài, đổi mật khẩu ----------
async function editPost(id) {
  const c = prompt("Sửa nội dung:", PC[id]); if (c === null) return;
  if (await api(`/api/posts/${id}/edit`, {content: c})) loadPosts();
}
async function delPost(id) { if (confirm("Xóa bài này?") && await api(`/api/posts/${id}/delete`, {})) { loadPosts(); loadLB(); } }
async function chpw() {
  const old = prompt("Mật khẩu cũ:"), nw = old && prompt("Mật khẩu mới (≥ 6 ký tự):");
  if (nw && await api("/api/password", {old, new: nw})) alert("Đã đổi mật khẩu!");
}

$("post-form").addEventListener("submit", async e => {
  e.preventDefault();
  const f = $("img").files[0];
  if (f && f.size > 2_000_000) return alert("Ảnh tối đa 2MB");
  const image = f ? await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); }) : null;
  const d = await api("/api/posts", {board: $("board-select").value, content: $("content").value, image});
  if (d) { $("content").value = ""; $("img").value = ""; }
  loadPosts(); loadLB();
});
$("search-form").addEventListener("submit", e => { e.preventDefault(); query = $("q").value.trim(); page = 1; loadPosts(); });

async function refresh() { await loadMe(); await loadBoards(); await loadPosts(); await loadLB(); }
refresh();
</script>
</body>
</html>
